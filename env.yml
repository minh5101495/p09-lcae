# Môi trường tái hiện S01 (P09 LC-AE) — dựng bằng MỘT lệnh:
#   conda env create -f env.yml
# Sau đó:
#   conda activate p09c
#   jupyter nbconvert --to notebook --execute --inplace P09_Autoencoder_Claude.ipynb
#
# Ghi chú phiên bản:
# - python 3.11: Sionna 2.0.1 yêu cầu Python >= 3.11 (đã kiểm trên PyPI).
# - torch 2.14.1: bản đã dùng trong lần chạy Colab; có wheel cp311 trên PyPI.
# - numpy/scipy/matplotlib/h5py: đúng phiên bản pip báo trong lần chạy Colab (đều có wheel cp311).
# - Máy KHÔNG có GPU NVIDIA vẫn dựng được nhưng chạy rất chậm; kết quả benchmark GPU sẽ không có.
name: p09c
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - jupyterlab
  - nbconvert
  - ipykernel
  - pandas
  - psutil
  - pip:
      - torch==2.14.1
      - sionna==2.0.1
      - numpy==2.4.6
      - scipy==1.16.3
      - matplotlib==3.11.2
      - h5py==3.16.0
